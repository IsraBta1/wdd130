<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us.">
    <meta name="author" content="Israel Betancourt">
    <title>Contact</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Logo" width="250">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 style="color: black;">White Water Rafting</h1>
        <div class="contact-layout" style="display: flex; align-items: flex-start; gap: 2rem;">
            <div class="hero" style="flex: 1;">
                <p>White Water Rafting Company</p>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>

            <form action="#" method="post" style="flex: 1; max-width: 500px;">
                <fieldset>
                    <legend>Contact Form</legend>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-group">
                        <p>Message Purpose</p>
                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="website">
                            Website Suggestion
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here..."
                          required></textarea>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </fieldset>
            </form>
        </div>

        <section>
            <h2>Contact Us</h2>

            <div class="cards-container">
                <figure>
                    <img src="images/rocosa.jpg" alt="Rocosa">
                    <figcaption>Rocky</figcaption>
                </figure>

                <figure>
                    <img src="images/calma.jpg" alt="Calm Down">
                    <figcaption>Calm</figcaption>
                </figure>

                <figure>
                    <img src="images/tormenta.jpg" alt="Storm">
                    <figcaption>Storm</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | White Water Rafting | Israel Betancourt</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png"
                  alt="Follow us on Facebook" width="150" height="150"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Follow us on Instagram" width="150" height="150"></a>
            <a href="https://x.com"><img src="images/xsocial.png" alt="Follow us on X" width="150"
                  height="150"></a>
        </nav>

    </footer>
</body>

</html>
