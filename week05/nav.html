<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intento de nav desplegable part 1</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: grid;
            justify-content: center;
        }

        nav {
            background-color: mediumturquoise;
            width: 130px;
            height: 180px;
            justify-content: center;
        }

        nav ul {
            list-style-type: none;

        }

        ul {
            display: flex;
            flex-direction: column;
            margin: auto;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="">obj 1</a></li>
            <li><a href="">obj 2</a></li>
            <li><a href="">obj 3</a></li>
        </ul>
    </nav>

</body>

</html>
